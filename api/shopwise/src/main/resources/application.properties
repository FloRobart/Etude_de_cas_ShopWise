spring.application.name=shopwise

# Configuration PostgreSQL // shopwise-db:5432 | localhost:32768
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopwise}
spring.datasource.username=${DB_USER:shopwise_user}
spring.datasource.password=${DB_PASSWORD:shopwise_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Error
spring.mvc.problemdetails.enabled=true
